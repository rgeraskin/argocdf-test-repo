apiVersion: v2
name: umbrella-app
version: 1.0.0
dependencies:
  # OCI dependency: `helm dependency build` must authenticate/pull via the
  # registry client (the argocd engine registers this inside its isolated home)
  - name: podinfo
    alias: ocidep
    version: 6.7.0
    repository: oci://ghcr.io/stefanprodan/charts
  # Classic HTTP(S) dependency: requires a repo index — the argocd engine
  # auto-registers it in its throwaway helm home (no --helm-add-repos)
  - name: podinfo
    alias: classicdep
    version: 6.7.0
    repository: https://stefanprodan.github.io/podinfo
