# A policy directory that exists ONLY to be DELETED by case/lint-policy-removed,
# which is the mirror of case/lint-policy-added: there the base side has no policies,
# here the TARGET side loses them. No other case's CASE_ARGS points at this directory,
# so adding it to master changes nothing else - a policy directory is inert until a
# --lint-kyverno flag names it.
#
# Deliberately a copy of policies/kyverno/disallow-latest-tag.yaml under its own name,
# so a finding from it is unmistakably this case's. apps/kustomize-app already carries
# `nginx:latest` on master, which is what lets the violation PRE-EXIST on both sides -
# the property lint-policy-added cannot have.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: images-must-be-pinned
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
  validations:
    - expression: >-
        object.spec.template.spec.containers.all(c,
          c.image.contains(':') && !c.image.endsWith(':latest'))
      message: "container images must be pinned to a tag (':latest' or tag-less images are not allowed)"
