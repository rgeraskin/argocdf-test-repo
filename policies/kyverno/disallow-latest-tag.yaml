# Generic image-hygiene policy: container images must be pinned (no :latest,
# no tag-less references). CEL ValidatingAdmissionPolicy, applied by the
# kyverno CLI via scripts/lint-kyverno.sh.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: disallow-latest-tag
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
  validations:
    - expression: >-
        object.spec.template.spec.containers.all(c,
          c.image.contains(':') && !c.image.endsWith(':latest'))
      message: "container images must be pinned to a tag (':latest' or tag-less images are not allowed)"
