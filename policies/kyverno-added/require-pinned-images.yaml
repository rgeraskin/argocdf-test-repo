# The FIRST policy of a policy directory that exists only on this branch: the
# base side of this case has no policies/kyverno-added at all, which is what
# makes it the "PR adds its first policy" shape. Deliberately a copy of
# policies/kyverno/disallow-latest-tag.yaml under its own name and directory, so
# the finding it produces is unmistakably this case's.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: require-pinned-images
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
  validations:
    - expression: >-
        object.spec.template.spec.containers.all(c,
          c.image.contains(':') && !c.image.endsWith(':latest'))
      message: "container images must be pinned to a tag (':latest' or tag-less images are not allowed)"
