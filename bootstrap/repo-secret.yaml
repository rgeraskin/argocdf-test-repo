# ArgoCD repository Secret for the private in-cluster registry: this is what
# `--repo-creds cluster` reads (via ArgoCD's own util/db). Scheme-less URL +
# enableOCI is the ArgoCD OCI-repo form; insecure allows the registry's
# bootstrap-generated self-signed certificate. Test-only credentials - see
# registry.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: private-registry
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  name: private-registry
  type: helm
  url: 127.0.0.1.nip.io:5317/charts
  enableOCI: "true"
  insecure: "true"
  username: e2e
  password: e2e
---
# The same registry, declared the OCI-ARTIFACT way. ArgoCD 3.1+ reads artifact
# sources through `type: oci` repositories (ListOCIRepositories), a list argocdf
# loads under --repo-creds cluster and no other case exercises. The URL is the
# ARTIFACT reference, not the repository prefix: an artifact source names the
# whole path (oci://host/charts/private-app), and credential lookup matches that
# URL, so the scheme-less prefix above cannot answer for it. Same throwaway
# credentials, same self-signed certificate.
apiVersion: v1
kind: Secret
metadata:
  name: private-registry-oci
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  name: private-registry-oci
  type: oci
  url: oci://127.0.0.1.nip.io:5317/charts/private-app
  insecure: "true"
  username: e2e
  password: e2e
