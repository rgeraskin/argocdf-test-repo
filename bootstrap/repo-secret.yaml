# ArgoCD repository Secret for the private in-cluster registry: this is what
# `--repo-creds cluster` reads (via ArgoCD's own util/db). Scheme-less URL +
# enableOCI is the ArgoCD OCI-repo form; insecure allows the registry's
# bootstrap-generated self-signed certificate. Test-only credentials - see
# registry.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: private-registry
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  name: private-registry
  type: helm
  url: 127.0.0.1.nip.io:5317/charts
  enableOCI: "true"
  insecure: "true"
  username: e2e
  password: e2e
