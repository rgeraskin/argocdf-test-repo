apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-svc-cm
data:
  tier: {{ .Values.tier | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-svc
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: svc
          image: nginx:1.27.0
