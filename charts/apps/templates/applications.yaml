{{- range .Values.applications }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: argocd
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  project: default
  destination:
    server: {{ $.Values.global.destinationServer }}
    namespace: {{ .namespace | default "default" }}
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
  {{- if .sources }}
  sources:
    {{- range .sources }}
    - repoURL: {{ .repoURL | default $.Values.global.repoURL }}
      targetRevision: {{ .targetRevision | default $.Values.global.targetRevision }}
      {{- if .chart }}
      chart: {{ .chart }}
      {{- end }}
      {{- if .path }}
      path: {{ .path }}
      {{- end }}
      {{- if .ref }}
      ref: {{ .ref }}
      {{- end }}
      {{- with .helm }}
      helm:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- else }}
  source:
    repoURL: {{ .repoURL | default $.Values.global.repoURL }}
    targetRevision: {{ .targetRevision | default $.Values.global.targetRevision }}
    {{- if .chart }}
    chart: {{ .chart }}
    {{- end }}
    {{- if .path }}
    path: {{ .path }}
    {{- end }}
    {{- with .helm }}
    helm:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .kustomize }}
    kustomize:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .directory }}
    directory:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
{{- end }}
